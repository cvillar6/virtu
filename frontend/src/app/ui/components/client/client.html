<main class="flex flex-col items-center bg-white px-6 py-8 lg:p-20">
    <div class="mb-6">
        <img [src]="client.image" [alt]="client.name">
    </div>
    <div>
        <p class="text-3xl text-title font-semibold text-center mb-4 lg:text-4xl">{{ client.name }}</p>
        <p class="text-2xl text-description text-center mb-10 lg:text-3xl">{{ client.position }}</p>
        <p class="text-xl text-title leading-9 text-center lg:text-2xl">{{ client.description }}</p>
    </div>
</main>
