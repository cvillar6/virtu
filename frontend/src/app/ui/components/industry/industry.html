<main>
    <div class="mb-6 rounded-4xl">
        <img class="w-full h-auto object-cover lg:w-[496px] lg:h-[400px]" [src]="industry.image"
            [alt]="industry.title" />
    </div>
    <div>
        <h3 class="text-3xl text-industry font-semibold mb-2.5">{{ industry.title }}</h3>
        <p class="text-xl text-industry leading-9">{{ industry.description }}</p>
    </div>
</main>
