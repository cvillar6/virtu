<main class="bg-solution-card rounded-xl p-6 h-full">
    <i [class]="coreValue.icon" class="text-icon mb-7" [ngClass]="tiny ? 'text-[32px]' : 'text-[48px]'"></i>
    <h3 class="text-white mb-7" [ngClass]="tiny ? 'text-2xl' : 'text-3xl'">
        {{coreValue.title}}
    </h3>
    <p class="text-white leading-9" [ngClass]="tiny ? 'text-base' : 'text-lg'">
        {{coreValue.description}}
    </p>
</main>
