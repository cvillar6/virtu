<main class="py-20 px-4 bg-primary rounded-3xl relative lg:px-20">
    <div class="max-w-[880px] relative z-10">
        <h2 class="text-3xl text-white text-center mb-6  lg:text-left lg:text-4xl">
            {{ bookDemo.title }}
        </h2>

        <p class="text-xl text-white text-center leading-9 mb-6  lg:text-left">
            {{ bookDemo.description }}
        </p>

        <div class="flex justify-center relative z-10 lg:justify-start">
            <a [href]="bookDemo.buttonLink" class="secondary-button hover:secondary-button-hover w-fit">
                {{ bookDemo.buttonText }}
            </a>
        </div>
    </div>

    <img src="images/cell-m.svg" alt="Ready to transform" class="absolute top-0 right-0 h-full lg:hidden z-0"
        loading="lazy">
    <img src="images/cell-d.svg" alt="Ready to transform" class="hidden lg:block absolute top-0 right-0 h-full z-0"
        loading="lazy">
</main>
